# 1단계: 큐 배관 로컬 검증용. GPU 없이 돈다.
#
# LocalStack이 S3 / SQS / DynamoDB를 로컬에서 흉내낸다. 애플리케이션 코드는
# boto3의 endpoint_url만 다를 뿐 실제 AWS와 완전히 동일하므로, 여기서 검증한
# 로직이 5단계에서 그대로 올라간다.
#
# 실행:  docker compose -f deploy/docker-compose.yml up --build

services:
  localstack:
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,sqs,dynamodb
      DEBUG: "0"
    volumes:
      # ready.d 에 넣은 스크립트는 LocalStack 기동 완료 후 자동 실행된다.
      - ./init-localstack.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # 컨텍스트가 deploy/ 인 이유: worker/jobspec.py 를 API 이미지에도
    # 넣어야 한다. 검증 규칙을 두 벌로 복사하면 반드시 어긋난다.
    build:
      context: .
      dockerfile: api/Dockerfile
    image: emr/api:${EMR_IMAGE_TAG:-dev}
    ports: ["8000:8000"]
    environment: &aws_env
      AWS_ENDPOINT_URL: http://localstack:4566
      # 브라우저가 직접 여는 주소(presigned URL 서명용). 컨테이너 내부 이름인
      # localstack:4566으로 서명하면 사용자 브라우저에서 열리지 않는다.
      # 운영에서는 이 변수를 비워두면 실제 S3 주소가 그대로 쓰인다.
      AWS_PUBLIC_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: ap-northeast-2
      # LocalStack은 자격증명을 검사하지 않지만 boto3가 요구하므로 더미를 넣는다.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # 리터럴로 박지 않는다. 예전엔 `S3_BUCKET: emr-jobs` 였는데, AWS 오버라이드가
      # 이걸 덮는 걸 빠뜨려서 워커가 실제 버킷(emr-jobs-fca87aed) 대신 존재하지
      # 않는 이름을 보고 전 작업을 HeadObject 404 로 날렸다. LocalStack 에서는
      # 이름이 정말 emr-jobs 라 스모크 테스트가 끝까지 초록불이었다.
      # 기본값은 그대로 두되 **덮을 수 있는 모양**으로 둬서, 환경변수 하나로
      # 모든 서비스가 같이 따라오게 한다(api 포함 — 빠뜨릴 자리를 없앤다).
      S3_BUCKET: ${S3_BUCKET:-emr-jobs}
      DDB_TABLE: ${DDB_TABLE:-emr-jobs}
    depends_on:
      localstack: {condition: service_healthy}

  # SAM3D 워커. 운영에서는 이것만 GPU 인스턴스로 뜨고 0대까지 줄어든다.
  worker-sam3d:
    build: ./worker
    image: emr/worker:${EMR_IMAGE_TAG:-dev}
    environment:
      <<: *aws_env
      QUEUE_NAME: emr-sam3d
      MOCK: "1"
      MOCK_SEC: "5"        # SAM3D 실제 50초를 5초로 축약해 테스트
      IDLE_EXIT_SEC: "0"   # 스스로 안 끝낸다 — 인스턴스 회수는 reaper가 판단한다
      STATE_DIR: /state
    volumes: ["emr-state:/state"]
    # 스팟 회수 시 도커가 SIGTERM을 보낸 뒤 기다려주는 시간. 기본값 10초로는
    # SAM3D 작업(30~50초)을 마칠 수 없어 그냥 SIGKILL 당한다.
    stop_grace_period: 90s
    depends_on:
      localstack: {condition: service_healthy}

  # uLayout + Omni3D 워커. 둘 다 2GB 미만이라 운영에서 한 인스턴스에 같이 올린다.
  worker-scene:
    build: ./worker
    image: emr/worker:${EMR_IMAGE_TAG:-dev}
    environment:
      <<: *aws_env
      QUEUE_NAME: emr-scene
      MOCK: "1"
      MOCK_SEC: "2"
      IDLE_EXIT_SEC: "0"
      STATE_DIR: /state
    volumes: ["emr-state:/state"]
    stop_grace_period: 30s
    depends_on:
      localstack: {condition: service_healthy}

  # 유휴 리퍼. 인스턴스당 하나만 뜬다(워커가 몇이든).
  # 로컬에서는 DRY_RUN=1이라 판단만 로그로 찍고 아무것도 죽이지 않는다.
  reaper:
    build: ./worker
    image: emr/worker:${EMR_IMAGE_TAG:-dev}
    command: ["python", "-u", "idle_reaper.py"]
    environment:
      <<: *aws_env
      STATE_DIR: /state
      EXPECT_WORKERS: emr-sam3d,emr-scene
      WATCH_QUEUES: emr-sam3d,emr-scene
      IDLE_EXIT_SEC: "120"
      DRY_RUN: "1"
    volumes: ["emr-state:/state"]
    depends_on:
      localstack: {condition: service_healthy}

volumes:
  # 워커들과 리퍼가 상태 파일을 주고받는 곳. 컨테이너가 재시작해도 내용이 남아야
  # 리퍼가 "방금 죽었다 살아난 워커"를 미기동과 구분할 수 있다.
  emr-state:
