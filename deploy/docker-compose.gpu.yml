# 3단계: 실제 모델을 붙인 GPU 스택. docker-compose.yml 위에 덮어쓰는 오버라이드다.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml up --build
#
# 기본 파일(docker-compose.yml)은 MOCK 워커로 배관만 검증한다. 이 파일은 그중
# worker-sam3d / worker-scene 을 실제 추론으로 바꾸고 사이드카 둘을 추가한다.
# 두 벌로 복사하지 않고 오버라이드로 둔 이유는, 큐 이름·버킷·리전 같은 공통 설정이
# 갈라지면 "로컬에선 됐는데 배포에서 안 되는" 전형적인 사고가 나기 때문이다.
#
# 전제: nvidia-container-toolkit 설치 (컨테이너에 호스트 GPU 드라이버를 주입한다)

x-gpu-build: &gpu_build
  context: ./worker
  dockerfile: ../gpu/Dockerfile
  args:
    # 이미지 안 경로를 호스트와 맞추기 위해 빌드 시점에 넣는다.
    # 로컬은 ${HOME}, AWS는 config.sh의 EMR_ROOT(/opt/emr).
    EMR_ROOT: ${EMR_ROOT:-${HOME}}

x-mounts: &model_mounts
  # 컨테이너 안 경로를 호스트와 똑같이 맞춘다. conda prefix와 editable 설치 경로가
  # 절대경로로 박혀 있어서, 다른 위치에 붙이면 import 자체가 깨진다.
  - ${EMR_ROOT:-${HOME}}/miniconda3:${EMR_ROOT:-${HOME}}/miniconda3:ro
  - ${EMR_ROOT:-${HOME}}/sam-3d-objects:${EMR_ROOT:-${HOME}}/sam-3d-objects:ro
  - ${EMR_ROOT:-${HOME}}/uLayout:${EMR_ROOT:-${HOME}}/uLayout:ro
  - ${EMR_ROOT:-${HOME}}/omni3d:${EMR_ROOT:-${HOME}}/omni3d:ro
  # omni3d 환경의 detectron2/pytorch3d는 editable 설치라 site-packages에
  # 코드가 없고 아래 소스 디렉터리를 가리킨다. 안 붙이면 ModuleNotFoundError다.
  # (pytorch3d는 ~/pytorch3d 가 아니라 omni3d 전용 빌드 쪽을 가리킨다)
  - ${EMR_ROOT:-${HOME}}/detectron2:${EMR_ROOT:-${HOME}}/detectron2:ro
  - ${EMR_ROOT:-${HOME}}/pytorch3d_omni3d_build:${EMR_ROOT:-${HOME}}/pytorch3d_omni3d_build:ro
  - ${EMR_ROOT:-${HOME}}/Empty_My_Room/sam3d/backend:${EMR_ROOT:-${HOME}}/Empty_My_Room/sam3d/backend:ro
  # HuggingFace 캐시(28GB)가 실질적인 가중치 저장소다. 락 파일을 쓰므로 rw로 붙인다.
  - ${EMR_ROOT:-${HOME}}/.cache/huggingface:${EMR_ROOT:-${HOME}}/.cache/huggingface
  - ${EMR_ROOT:-${HOME}}/.cache/torch:${EMR_ROOT:-${HOME}}/.cache/torch

# WSL2의 dxg 드라이버는 공유 GPU 리소스마다 fd를 하나씩 쓴다. Docker 기본
# 소프트 한도가 1024라서, 파이프라인을 캐시해 둔 채 두 번째 작업을 돌리면
# fd가 바닥나 `CUDA driver error: unknown error`로 죽었다(dmesg에는
# `dxgk: get_unused_fd_flags failed: ffffffe8` = -24 EMFILE로 찍힌다).
# 호스트 하드 한도가 1048576이므로 소프트만 거기에 맞춘다.
x-ulimits: &big_nofile
  nofile:
    soft: 1048576
    hard: 1048576

x-gpu: &gpu_reservation
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  # ── SAM3D 워커 (GPU, 무거움) ──────────────────────────────────────────
  worker-sam3d:
    build: *gpu_build
    image: emr/gpu:${EMR_IMAGE_TAG:-dev}
    environment:
      MOCK: "0"
      HOME: ${EMR_ROOT:-${HOME}}
      SAM3D_BACKEND_DIR: ${EMR_ROOT:-${HOME}}/Empty_My_Room/sam3d/backend
      # 캐싱 할당자가 세그먼트를 넓혀 쓰게 해 단편화를 줄인다(services.sh와 동일).
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes: *model_mounts
    ulimits: *big_nofile
    # PyTorch 캐시는 프로세스 간에 공유되지 않는다. 이 워커가 먼저 작업을 받아
    # 캐시를 22GB로 불려버리면, 뒤늦게 뜨는 scene 모델(약 1.9GB)은 들어갈 자리가
    # 없어 죽는다. 세 컨테이너를 한 GPU에 올리는 구성에서는 scene이 자기 몫을
    # 먼저 확보한 뒤에 이 워커가 확장해야 한다. 그 순서를 여기서 강제한다.
    depends_on:
      ulayout:  {condition: service_healthy}
      omni3d:   {condition: service_healthy}
    deploy: *gpu_reservation

  # ── scene 워커 (CPU, 사이드카로 전달만) ───────────────────────────────
  # 모델을 직접 안 돌리므로 GPU를 잡지 않는다. GPU는 사이드카 둘이 쓴다.
  worker-scene:
    environment:
      MOCK: "0"
      ULAYOUT_URL: http://ulayout:8002
      OMNI3D_URL: http://omni3d:8003
    # service_started는 컨테이너 프로세스가 떴다는 뜻일 뿐 모델 로드가 끝났다는
    # 보장이 아니다. 모델이 없으면 첫 요청이 그냥 실패한다.
    depends_on:
      ulayout:  {condition: service_healthy}
      omni3d:   {condition: service_healthy}

  # ── uLayout 사이드카 (GPU) ────────────────────────────────────────────
  ulayout:
    build: *gpu_build
    image: emr/gpu:${EMR_IMAGE_TAG:-dev}
    working_dir: ${EMR_ROOT:-${HOME}}/uLayout
    # server.py 를 직접 띄우지 않고 래퍼를 띄운다. 래퍼가 server 를 import 해서
    # '모델 로드 → 더미 추론 1회 → 그 다음에 READY' 로 기동 순서만 바꾼다.
    # 원본은 :ro 마운트라 못 고치고, 고칠 필요도 없다(ulayout_boot.py 머리말).
    command: ["${EMR_ROOT:-${HOME}}/miniconda3/envs/uLayout/bin/python", "-u", "/app/ulayout_boot.py"]
    environment:
      HOME: ${EMR_ROOT:-${HOME}}
      ULAYOUT_DIR: ${EMR_ROOT:-${HOME}}/uLayout
      # 더미 입력 해상도. 프론트·백엔드 어디에도 축소가 없어서 폰 사진이
      # 원본 크기로 들어온다 — 같은 크기로 덥혀야 의미가 있다.
      ULAYOUT_WARM_SIZE: ${ULAYOUT_WARM_SIZE:-3024x4032}
    # /health는 모델이 안 올라가도 status:ok 를 반환한다. 그래서 status가 아니라
    # ulayout_loaded 플래그를 봐야 한다. 이미지에 curl이 없어 python으로 짠다.
    # 래퍼를 쓰면서 이 플래그는 '웜업까지 끝났다'는 뜻으로 좁아졌다.
    healthcheck:
      test: ["CMD", "${EMR_ROOT:-${HOME}}/miniconda3/envs/uLayout/bin/python", "-c",
             "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8002/health',timeout=5)); sys.exit(0 if d.get('ulayout_loaded') else 1)"]
      interval: 10s
      timeout: 10s
      retries: 40        # 모델 로드가 느려도 기다린다 (start_period 뒤 40회 x 10초)
      # 로드만 할 땐 120초로 넉넉했지만 이제 더미 추론 한 번이 뒤에 붙는다.
      # 이 구간의 실패는 unhealthy 로 세지 않는다 — 늘려도 느려지지 않고
      # 첫 성공이 뜨는 즉시 healthy 가 된다.
      start_period: 300s
    volumes: *model_mounts
    ulimits: *big_nofile
    deploy: *gpu_reservation

  # ── Omni3D 사이드카 (GPU) ─────────────────────────────────────────────
  omni3d:
    build: *gpu_build
    image: emr/gpu:${EMR_IMAGE_TAG:-dev}
    working_dir: ${EMR_ROOT:-${HOME}}/omni3d
    command: ["${EMR_ROOT:-${HOME}}/miniconda3/envs/omni3d/bin/python", "-u", "server.py"]
    environment:
      HOME: ${EMR_ROOT:-${HOME}}
      # pytorch3d._C 로드에 이 env의 torch/lib이 필요하다(services.sh와 동일한 이유).
      LD_LIBRARY_PATH: ${EMR_ROOT:-${HOME}}/miniconda3/envs/omni3d/lib/python3.10/site-packages/torch/lib
    # /health는 모델이 안 올라가도 status:ok 를 반환한다. 그래서 status가 아니라
    # omni3d_loaded 플래그를 봐야 한다. 이미지에 curl이 없어 python으로 짠다.
    healthcheck:
      test: ["CMD", "${EMR_ROOT:-${HOME}}/miniconda3/envs/omni3d/bin/python", "-c",
             "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8003/health',timeout=5)); sys.exit(0 if d.get('omni3d_loaded') else 1)"]
      interval: 10s
      timeout: 10s
      retries: 40        # 모델 로드가 느려도 기다린다 (start_period 뒤 40회 x 10초)
      start_period: 120s
    volumes: *model_mounts
    ulimits: *big_nofile
    deploy: *gpu_reservation
