# 4단계: AWS GPU 인스턴스에서 도는 오버라이드.
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.gpu.yml \
#                  -f deploy/docker-compose.aws.yml up -d
#
# 로컬과 달라지는 건 딱 다섯 가지다. 나머지는 전부 같은 파일을 쓴다 —
# "로컬에선 됐는데 배포에서 안 되는" 경우를 줄이려면 차이를 최대한 줄여야 한다.
#
#   1. LocalStack이 없다 → AWS_ENDPOINT_URL을 비워 실제 AWS를 보게 한다.
#   2. API 서버는 여기 없다 → 별도 t4g.small에서 돈다.
#   3. 리퍼가 진짜로 인스턴스를 회수한다(DRY_RUN=0).
#   4. 자격증명은 IAM 역할에서 온다 → 더미 키를 지운다.
#   5. 버킷/테이블 이름이 다르다 → 실제 이름으로 덮어쓴다.
#
# 5번은 6단계 부하 테스트에서 터져서 뒤늦게 추가했다. 기본 파일이
# `S3_BUCKET: emr-jobs` 를 **리터럴로** 박아 두는데, 실제 버킷은 계정 해시가
# 붙은 emr-jobs-fca87aed 다. 여기서 안 덮으니 워커 14건이 전부
# HeadObject 404 로 죽었다. 스모크 테스트는 LocalStack 에서 돌고 거기선 버킷
# 이름이 정말 emr-jobs 라서, 이 버그를 끝까지 못 잡았다.
#
# 교훈은 "오버라이드를 하나 빠뜨렸다"가 아니라 **빠뜨렸는지 아무도 안 본다**는
# 쪽이다. DDB_TABLE 은 양쪽이 우연히 emr-jobs 로 같아서 멀쩡히 돌았고, 그래서
# 상태 갱신은 되고 S3 만 안 되는 헷갈리는 모양이 나왔다. 그 우연에 기대지
# 않도록 테이블도 같이 명시한다.
#
# 기본값을 안 준다(`:?`). 값이 비면 여기서 즉시 멈추는 편이, 그럴듯한 이름으로
# 조용히 떨어져 404 를 보는 것보다 훨씬 싸다 — 이번에 치른 값이 그 증거다.

# 공통 환경변수. 예전에는 worker-sam3d 의 environment 에 앵커를 달아 두고
# scene/reaper 가 그걸 재사용했는데, 그러면 sam3d **한 쪽에만** 주고 싶은 값을
# 넣을 자리가 없다(넣는 순간 셋 다 받는다). 그래서 서비스 밖으로 뺐다.
x-aws-real: &aws_real
  # 빈 문자열이면 boto3가 실제 AWS 엔드포인트를 쓴다(worker.py가 `or None` 처리).
  AWS_ENDPOINT_URL: ""
  AWS_PUBLIC_ENDPOINT_URL: ""
  AWS_ACCESS_KEY_ID: ""      # IAM 역할에서 받는다 — 키를 넣으면 오히려 역할을 가린다
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  S3_BUCKET: ${S3_BUCKET:?deploy/.env 에 S3_BUCKET 이 없다 — userdata 가 쓴다}
  DDB_TABLE: ${DDB_TABLE:?deploy/.env 에 DDB_TABLE 이 없다 — userdata 가 쓴다}
  MOCK: "0"

# ── 로그 ────────────────────────────────────────────────────────────────
# 6단계 부하 테스트까지 이 배포에는 컨테이너 로그가 기기 밖으로 나오는 경로가
# 하나도 없었다. 워커는 SSH 키가 없고(KeyName: None), 워커 보안그룹은 인바운드
# 규칙이 0개고, EC2 콘솔 출력은 64KB 상한이라 커널 부팅 메시지가 그걸 다 채운다.
# 그래서 "sam3d 첫 건 1230초, 두 번째 49초"를 관측해 놓고도 그 20분 동안
# 컨테이너 안에서 무슨 일이 있었는지 확인할 방법이 없었다.
#
# mode: non-blocking 이 필수다. awslogs 드라이버는 기본이 blocking 이라
# CloudWatch 가 느려지면 **컨테이너의 stdout 쓰기가 막힌다.** GPU 워커가 로그
# 전송 때문에 멈추는 건 말이 안 된다. 버퍼가 차면 로그를 버리는 쪽을 택한다.
#
# 사이드카(ulayout/omni3d)도 넣는다. 보고 싶은 게 "워커가 느릴 때 사이드카가
# 뭘 하고 있었나"라서, 워커만 보내면 정작 궁금한 쪽이 빠진다.
#
# 그룹 하나 + 서비스별 스트림이다. tag 에 {{.ID}} 를 반드시 남긴다 — 인스턴스가
# 여러 대면 같은 이름의 컨테이너가 여럿이고, 컨테이너 ID 가 없으면 두 인스턴스의
# worker-sam3d 가 같은 스트림에 섞여 들어간다.
#
# 기본값을 주는 이유: userdata 가 .env 에 LOG_GROUP 을 쓰지 않는다(유저데이터
# 16KB 한도가 빡빡하다). 대신 네 번째 -f 오버라이드가 config.sh 의 값을 직접
# 넣으므로, config.sh 를 고치면 **재굽기 없이** 그쪽이 이긴다.
x-log: &log
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-ap-northeast-2}
    awslogs-group: ${LOG_GROUP:-/emr/worker}
    awslogs-create-group: "true"
    mode: non-blocking
    max-buffer-size: 4m
    tag: "{{.Name}}/{{.ID}}"

services:
  # LocalStack은 이미지 자체를 띄우지 않는다. scale: 0 으로 비활성화한다.
  localstack:
    scale: 0
  api:
    scale: 0

  worker-sam3d:
    logging: *log
    environment:
      <<: *aws_real
      QUEUE_NAME: ${Q_SAM3D:-emr-sam3d}
      IDLE_EXIT_SEC: "0"          # 스스로 안 끝낸다 — 리퍼가 인스턴스째 회수한다
      # 워밍 게이트는 **이 워커에만** 건다. scene 은 사이드카로 넘기기만 해서
      # 디스크를 거의 안 읽는다 — 같이 묶어 세우면 가벼운 작업까지 늦어진다.
      WARM_GATE_FILE: /warm/warm-bg.done
      # 상한 180초. 워밍 대상이 47GB(약 600초)에서 8GB 로 줄었고, 64갈래
      # 80 MB/s 면 약 100초다. 상한은 "워밍이 멈췄을 때 언제 포기하느냐"이지
      # 기다릴 시간이 아니다 — 플래그가 뜨면 바로 통과한다. 600초로 두면
      # 워밍이 고장났을 때 작업 하나가 10분을 그냥 서 있는다.
      # (userdata 가 .env 에 안 쓰므로 이 기본값이 실제로 쓰이는 값이다.)
      WARM_GATE_MAX_SEC: ${WARM_GATE_MAX_SEC:-180}
    volumes:
      # 호스트의 백그라운드 워밍이 끝났다는 플래그만 보려고 붙인다. 읽기 전용이고
      # /run 이라 tmpfs 다(부팅마다 깨끗하다 — 지난 부팅의 플래그가 남으면 게이트가
      # 처음부터 열려 의미가 없다). userdata 가 만들고 systemd ExecStopPost 가 쓴다.
      - /run/emr:/warm:ro
    # localstack 의존만 끊고 사이드카 의존은 반드시 남긴다. 여기서 통째로 비우면
    # ①(세 컨테이너 한 대)의 전제인 "scene이 VRAM을 먼저 확보한다"가 깨진다.
    # depends_on은 맵이라 병합되므로, 기본 파일의 localstack 항목을 !reset으로
    # 지우고 사이드카 둘을 다시 적는다.
    depends_on:
      localstack: !reset null
      ulayout: {condition: service_healthy}
      omni3d:  {condition: service_healthy}

  worker-scene:
    logging: *log
    environment:
      <<: *aws_real
      QUEUE_NAME: ${Q_SCENE:-emr-scene}
    depends_on:
      localstack: !reset null
      ulayout: {condition: service_healthy}
      omni3d:  {condition: service_healthy}

  reaper:
    logging: *log
    environment:
      <<: *aws_real
      QUEUE_NAME: ""
      STATE_DIR: /state
      EXPECT_WORKERS: ${Q_SAM3D:-emr-sam3d},${Q_SCENE:-emr-scene}
      WATCH_QUEUES: ${Q_SAM3D:-emr-sam3d},${Q_SCENE:-emr-scene}
      # 비용 모델 결과: 20세션/일 기준 유휴 900초면 월 $148, 120초면 $65다.
      # 부팅 3분을 어차피 감수하는 구성이므로 유휴를 길게 둘 이유가 없다.
      IDLE_EXIT_SEC: ${IDLE_EXIT_SEC:-120}
      DRY_RUN: "0"
    depends_on: !reset []
    # 리퍼는 인스턴스 메타데이터(169.254.169.254)를 읽어야 자기 instance-id와
    # 스팟 회수 통지를 안다. 브리지 네트워크에서도 닿긴 하지만, IMDS 기본 홉 한도가
    # 1이라 컨테이너에서는 막힌다. 시작 템플릿에서 홉 한도를 2로 올려두었다
    # (20-launch-template.sh의 MetadataOptions 참고).
    restart: unless-stopped

  # 사이드카는 이 파일에서 바꿀 게 로그뿐이다. 나머지 설정은 기본/GPU 파일을
  # 그대로 쓴다 — 여기 적으면 두 군데를 맞춰야 한다.
  ulayout:
    logging: *log
  omni3d:
    logging: *log
